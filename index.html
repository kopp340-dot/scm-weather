<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCM Live-Wetter Mattsee</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

    <div class="header-left">

        <img
            src="assets/logo/scm-stander.png"
            alt="SCM"
            class="logo">

        <div>

            <h1>SCM Live-Wetter</h1>

            <div class="subtitle">
                Mattsee
            </div>

        </div>

    </div>

    <div class="header-right">

        <div id="liveStatus" class="live">
            🟢 LIVE
        </div>

        <div id="timestamp">
            --
        </div>

    </div>

</header>

<main>

<!-- WIND -->

<section class="card wind-card">

    <div class="wind-number">

        <span id="wind">--</span>

        <span class="wind-unit">kt</span>

    </div>

    <div id="beaufort" class="beaufort">
        -- Bft
    </div>

    <div class="wind-direction">

        <div class="windrose">

            <div class="north">N</div>
            <div class="north-east">NO</div>
            <div class="east">O</div>
            <div class="south-east">SO</div>
            <div class="south">S</div>
            <div class="south-west">SW</div>
            <div class="west">W</div>
            <div class="north-west">NW</div>

            <div id="windArrow" class="wind-arrow">

                <svg viewBox="0 0 100 100">

                    <line
                        x1="50"
                        y1="82"
                        x2="50"
                        y2="18"
                        stroke="#d60000"
                        stroke-width="6"
                        stroke-linecap="round"/>

                    <polygon
                        points="50,8 40,26 60,26"
                        fill="#d60000"/>

                </svg>

            </div>

            <div class="center"></div>

        </div>

        <div id="directionValue">
            --
        </div>

        <div id="directionText">
            --
        </div>

    </div>

    <div class="gust-box">

        Böen

        <span id="gust">
            --
        </span>

    </div>

</section>

<!-- SEGELAMPEL -->

<section class="card">

    <div
        id="sailingLight"
        class="traffic-light">

        Wird berechnet...

    </div>

</section>

<!-- WETTERDATEN -->

<section class="weather-grid">

<div class="small-card">

<div class="icon">🌡</div>

<div class="label">Temperatur</div>

<div id="temperature" class="value">

--

</div>

</div>

<div class="small-card">

<div class="icon">💧</div>

<div class="label">Luftfeuchte</div>

<div id="humidity" class="value">

--

</div>

</div>

<div class="small-card">

<div class="icon">⬇</div>

<div class="label">Luftdruck</div>

<div id="pressure" class="value">

--

</div>

</div>

<div class="small-card">

<div class="icon">☔</div>

<div class="label">Niederschlag</div>

<div id="rain" class="value">

--

</div>

</div>

</section>

<section class="card footer-card">

    <div id="refreshInfo">
        Nächste Aktualisierung ...
    </div>

   <div id="version" class="version"></div>

</section>

<script src="js/app.js"></script>
