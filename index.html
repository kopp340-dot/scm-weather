<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Live-Wetter am Mattsee für Segelclub Mattsee: Wind, Böen, Windrichtung, Segelampel und aktuelle Wetterdaten von GeoSphere Austria.">
<meta name="theme-color" content="#005a9c">

<title>SCM Live-Wetter Mattsee</title>

<link rel="icon" type="image/png" href="assets/logo/scm-stander.png">
<link rel="apple-touch-icon" href="assets/logo/scm-stander.png">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

    <div class="header-left">

        <img
            src="assets/logo/scm-stander.png"
            alt="SCM"
            class="logo">

        <div>

            <h1>SCM Live-Wetter</h1>

            <div class="subtitle">
                Mattsee
            </div>

        </div>

    </div>

    <div class="header-right">

        <div id="liveStatus" class="live">
            🟢 LIVE
        </div>

        <div id="timestamp">
            --
        </div>

    </div>

</header>

<main>

<!-- WIND -->

<section class="card wind-card">

    <div class="wind-number">

        <span id="wind">--</span>

        <span class="wind-unit">kt</span>

    </div>

    <div id="beaufort" class="beaufort">
        -- Bft
    </div>

    <div class="wind-direction">

        <div class="windrose">

            <div class="north">N</div>
            <div class="north-east">NO</div>
            <div class="east">O</div>
            <div class="south-east">SO</div>
            <div class="south">S</div>
            <div class="south-west">SW</div>
            <div class="west">W</div>
            <div class="north-west">NW</div>

            <!-- Skalenstriche (Kompass) -->
            <svg class="windrose-ticks" viewBox="0 0 200 200" aria-hidden="true">
                <!-- Hauptrichtungen (lang, dick) -->
                <g class="tick-major" stroke="#1d3a5c" stroke-width="2.5">
                    <line x1="100" y1="10" x2="100" y2="22"/>
                    <line x1="100" y1="178" x2="100" y2="190"/>
                    <line x1="10" y1="100" x2="22" y2="100"/>
                    <line x1="178" y1="100" x2="190" y2="100"/>
                </g>
                <!-- Nebenrichtungen (mittel) -->
                <g class="tick-minor" stroke="#5a7a9c" stroke-width="1.8">
                    <line x1="163.6" y1="36.4" x2="158.0" y2="42.0"/>
                    <line x1="163.6" y1="163.6" x2="158.0" y2="158.0"/>
                    <line x1="36.4" y1="163.6" x2="42.0" y2="158.0"/>
                    <line x1="36.4" y1="36.4" x2="42.0" y2="42.0"/>
                </g>
                <!-- Feinstriche alle 30° -->
                <g class="tick-fine" stroke="#9fb3c8" stroke-width="1">
                    <line x1="145.0" y1="22.1" x2="141.0" y2="29.0"/>
                    <line x1="177.9" y1="55.0" x2="171.0" y2="59.0"/>
                    <line x1="177.9" y1="145.0" x2="171.0" y2="141.0"/>
                    <line x1="145.0" y1="177.9" x2="141.0" y2="171.0"/>
                    <line x1="55.0" y1="177.9" x2="59.0" y2="171.0"/>
                    <line x1="22.1" y1="145.0" x2="29.0" y2="141.0"/>
                    <line x1="22.1" y1="55.0" x2="29.0" y2="59.0"/>
                    <line x1="55.0" y1="22.1" x2="59.0" y2="29.0"/>
                </g>
            </svg>

            <div id="windArrow" class="wind-arrow">

                <svg viewBox="0 0 100 100">

                    <!-- Schaft des Pfeils -->
                    <line
                        x1="50"
                        y1="88"
                        x2="50"
                        y2="20"
                        stroke="#d60000"
                        stroke-width="8"
                        stroke-linecap="round"/>

                    <!-- Pfeilspitze -->
                    <polygon
                        points="50,6 34,30 66,30"
                        fill="#d60000"/>

                </svg>

            </div>

            <div class="center"></div>

        </div>

        <div id="directionValue">
            --
        </div>

        <div id="directionText">
            --
        </div>

    </div>

    <div class="gust-box">

        Böen

        <span id="gust">
            --
        </span>

    </div>

</section>

<!-- SEGELAMPEL -->

<section class="card">

    <div
        id="sailingLight"
        class="traffic-light">

        Wird berechnet...

    </div>

</section>

<!-- WETTERDATEN -->

<section class="weather-grid">

<div class="small-card">

<div class="icon">🌡</div>

<div class="label">Temperatur</div>

<div id="temperature" class="value">

--

</div>

</div>

<div class="small-card">

<div class="icon">💧</div>

<div class="label">Luftfeuchte</div>

<div id="humidity" class="value">

--

</div>

</div>

<div class="small-card">

<div class="icon">⬇</div>

<div class="label">Luftdruck</div>

<div id="pressure" class="value">

--

</div>

</div>

<div class="small-card">

<div class="icon">☔</div>

<div class="label">Niederschlag</div>

<div id="rain" class="value">

--

</div>

</div>

</section>

<section class="card footer-card">

    <div id="refreshInfo">
        Nächste Aktualisierung ...
    </div>

   <div id="version" class="version"></div>

</section>

</main>

<script src="js/app.js"></script>

</body>

</html>
