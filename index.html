<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCM Wetterstation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>SCM Wetterstation Mattsee</h1>

<div class="card wind-card">
    <h2>🌬 Wind</h2>

    <div id="wind" class="wind-value">--</div>

    <div id="direction" class="direction">--</div>

    <p>Böen: <span id="gust">--</span></p>
</div>

<div class="card">
    <p><strong>🌡 Temperatur:</strong> <span id="temperature">--</span></p>
    <p><strong>⬇ Luftdruck:</strong> <span id="pressure">--</span></p>
    <p><strong>💧 Luftfeuchte:</strong> <span id="humidity">--</span></p>
    <p><strong>☔ Niederschlag:</strong> <span id="rain">--</span></p>
    <p><strong>🕒 Letzte Messung:</strong> <span id="timestamp">--</span></p>
</div>

<script src="js/app.js"></script>

</body>
</html>
