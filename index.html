<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Live-Wetter am Mattsee für Segelclub Mattsee: Wind, Böen, Windrichtung, Segelampel und aktuelle Wetterdaten von GeoSphere Austria.">
<meta name="theme-color" content="#005a9c">

<title>SCM Live-Wetter Mattsee</title>

<link rel="icon" type="image/png" href="assets/logo/scm-stander.png">
<link rel="apple-touch-icon" href="assets/logo/scm-stander.png">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Panorama-Kamera Hintergrund (Segelclub Mattsee) -->
<img id="webcamBg" class="webcam-bg" alt="" aria-hidden="true">

<header class="header">

    <div class="header-left">

        <img
            src="assets/logo/scm-stander.png"
            alt="SCM"
            class="logo">

        <div>

            <h1>SCM Live-Wetter</h1>

            <div class="subtitle">
                Mattsee
            </div>

        </div>

    </div>

    <div class="header-right">

        <div id="liveStatus" class="live">
            🟢 LIVE
        </div>

        <div id="timestamp">
            --
        </div>

    </div>

</header>

<main>

<!-- WIND -->

<section class="card wind-card">

    <div class="wind-number">

        <span id="wind">--</span>
        <span class="wind-unit">kt</span>
        <span id="windTrend"></span>

    </div>

    <div id="beaufort" class="beaufort">
        -- Bft
    </div>

    <div class="wind-direction">

        <div class="windrose">

            <!-- Skalenstriche (Kompass) -->
            <svg class="windrose-ticks" viewBox="0 0 200 200" aria-hidden="true">
                <!-- Hauptrichtungen (lang, dick) -->
                <g class="tick-major" stroke="#1d3a5c" stroke-width="2.5">
                    <line x1="100" y1="28" x2="100" y2="40"/>
                    <line x1="100" y1="160" x2="100" y2="172"/>
                    <line x1="28" y1="100" x2="40" y2="100"/>
                    <line x1="160" y1="100" x2="172" y2="100"/>
                </g>
                <!-- Nebenrichtungen (mittel) -->
                <g class="tick-minor" stroke="#5a7a9c" stroke-width="1.8">
                    <line x1="150.9" y1="49.1" x2="143.8" y2="56.2"/>
                    <line x1="150.9" y1="150.9" x2="143.8" y2="143.8"/>
                    <line x1="49.1" y1="150.9" x2="56.2" y2="143.8"/>
                    <line x1="49.1" y1="49.1" x2="56.2" y2="56.2"/>
                </g>
                <!-- Feinstriche alle 30° -->
                <g class="tick-fine" stroke="#9fb3c8" stroke-width="1">
                    <line x1="136.0" y1="37.6" x2="133.0" y2="42.8"/>
                    <line x1="162.4" y1="64.0" x2="157.2" y2="67.0"/>
                    <line x1="162.4" y1="136.0" x2="157.2" y2="133.0"/>
                    <line x1="136.0" y1="162.4" x2="133.0" y2="157.2"/>
                    <line x1="64.0" y1="162.4" x2="67.0" y2="157.2"/>
                    <line x1="37.6" y1="136.0" x2="42.8" y2="133.0"/>
                    <line x1="37.6" y1="64.0" x2="42.8" y2="67.0"/>
                    <line x1="64.0" y1="37.6" x2="67.0" y2="42.8"/>
                </g>
            </svg>

            <div class="north">N</div>
            <div class="north-east">NO</div>
            <div class="east">O</div>
            <div class="south-east">SO</div>
            <div class="south">S</div>
            <div class="south-west">SW</div>
            <div class="west">W</div>
            <div class="north-west">NW</div>

            <div id="windArrow" class="wind-arrow">

                <svg viewBox="0 0 100 100">

                    <!-- Schaft des Pfeils -->
                    <line
                        x1="50"
                        y1="88"
                        x2="50"
                        y2="20"
                        stroke="#d60000"
                        stroke-width="8"
                        stroke-linecap="round"/>

                    <!-- Pfeilspitze -->
                    <polygon
                        points="50,6 34,30 66,30"
                        fill="#d60000"/>

                </svg>

            </div>

            <div class="center"></div>

        </div>

        <div id="directionValue">
            --
        </div>

        <div id="directionText">
            --
        </div>

    </div>

    <div class="gust-box gust-value">

        <span id="gustLabel">Böen</span>

        <span id="gust">
            --
        </span>

    </div>

</section>

<!-- SEGELAMPEL -->

<section class="card">

    <div
        id="sailingLight"
        class="traffic-light">

        Wird berechnet...

    </div>

    <div class="link-group">

        <a class="ext-link" href="https://luke-ff.github.io/GeosphereGraph/" target="_blank" rel="noopener">
            Weitere Wind-Infos &rarr;
        </a>

        <a class="ext-link" href="https://www.salzburg.gv.at/wasser/hydro/#/Seen?station=203604" target="_blank" rel="noopener">
            Wasserstand &amp; Temp. &rarr;
        </a>

        <a class="ext-link" href="https://warnungen.zamg.at/" target="_blank" rel="noopener">
            Wetterwarnungen &rarr;
        </a>

    </div>

</section>

<!-- WETTERDATEN -->

<section class="weather-grid">

<div class="small-card">

<div class="icon">
<svg viewBox="0 0 24 24" width="40" height="40" fill="#ff6b35">
  <path d="M13 4c-1.1 0-2 .9-2 2h4c0-1.1-.9-2-2-2zm-1 11h2v6h-2zm0-13h2v2h-2z"/>
  <path d="M6.5 10c0-2.5 2-4.5 4.5-4.5H14c0 1.1.9 2 2 2s2-.9 2-2c-2.5 0-4.5 2-4.5 4.5v1.5h-2C8.5 10 6.5 8 6.5 10z"/>
</svg>
</div>

<div class="label">Temperatur</div>

<div class="value"><span id="temperature">--</span><span id="tempTrend" class="trend"></span></div>

</div>

<div class="small-card">

<div class="icon">
<svg viewBox="0 0 24 24" width="40" height="40" fill="#4a90e2">
  <path d="M12 2C8.7 2 8.3 2.02 7 3c-1.3 1-2 2.7-2 4.5 0 1.5 0.8 2.9 2 3.8C6 14.2 8.3 16 12 16s6-1.8 6-3.8c1.2-1 2-2.7 2-4.5 0-1.8-0.7-3.4-2-4.5-1.3-1-1.7-.98-4-1zm0 3c2.8 0 5 2.2 5 5s-2.2 5-5 5-5-2.2-5-5c0-2.8 2.2-5 5-5z"/>
</svg>
</div>

<div class="label">Luftfeuchte</div>

<div id="humidity" class="value">
--
</div>

</div>

<div class="small-card">

<div class="icon">
<svg viewBox="0 0 24 24" width="40" height="40" fill="#4a90e2">
  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.08c-1.38-.25-2.5-1.43-2.5-2.88.01-1.4.99-2.59 2.4-2.88 1.39-.29 2.5 1.04 2.5 2.49 0 1.41-.99 2.59-2.4 2.88-.29.1-1.04.1-1.38.25z"/>
  <circle cx="12" cy="12" r="3"/>
</svg>
</div>

<div class="label">Luftdruck</div>

<div class="value"><span id="pressure">--</span><span id="pressureTrend" class="trend"></span></div>

</div>

<div class="small-card">

<div class="icon">
<svg viewBox="0 0 24 24" width="40" height="40" fill="#4a90e2">
  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm-2 11.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
  <path d="M11 7h2v1h-2zm0 3h2v1h-2zm0 3h2v1h-2z"/>
</svg>
</div>

<div class="label">Niederschlag</div>

<div id="rain" class="value">
--
</div>

</div>

</section>

<section class="card footer-card">

    <div id="refreshInfo">
        Nächste Aktualisierung ...
    </div>

   <div id="version" class="version"></div>

</section>

</main>

<script src="js/app.js"></script>

</body>

</html>
